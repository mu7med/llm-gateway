# llm-gateway example configuration
# Copy to config/gateway.yaml and adapt. API keys come from the environment
# (api_key_env per backend) — never put keys in this file.

backends:
  - name: provider-main
    type: openai_compat
    base_url: https://api.provider-main.example/v1
    api_key_env: PROVIDER_MAIN_API_KEY
    timeout: 120
    models:
      fast-cheap:        {input_cost_per_1k: 0.0001, output_cost_per_1k: 0.0004}
      deepseek-v4-flash: {input_cost_per_1k: 0.0002, output_cost_per_1k: 0.0008}
      kimi-k2-code:      {input_cost_per_1k: 0.0006, output_cost_per_1k: 0.0024}

  - name: provider-backup
    type: openai_compat
    base_url: https://api.backup.example/v1
    api_key_env: PROVIDER_BACKUP_API_KEY
    models:
      backup-small: {input_cost_per_1k: 0.0002, output_cost_per_1k: 0.0009}

  # Providers whose terms permit training on prompts/completions.
  # Keep them OUT of sensitive_purposes via sensitive_excluded_backends.
  - name: data-training-provider
    type: openai_compat
    base_url: https://api.datatraining.example/v1
    api_key_env: DATA_TRAINING_API_KEY
    models:
      free-tier: {input_cost_per_1k: 0.0, output_cost_per_1k: 0.0}

routes:
  default:          ["provider-main:fast-cheap", "provider-backup:backup-small"]
  summarization:    ["provider-main:fast-cheap", "data-training-provider:free-tier"]
  code_simple:      ["provider-main:kimi-k2-code", "provider-main:fast-cheap"]
  code_complex:     ["provider-main:kimi-k2-code", "provider-backup:backup-small"]
  reasoning:        ["provider-main:deepseek-v4-flash", "provider-backup:backup-small"]
  high_volume_batch: ["provider-main:fast-cheap", "provider-backup:backup-small"]

# Sensitive purposes (secrets, credentials, proprietary code, strategy) never
# touch backends that may train on data. Policy, not a tuning knob.
sensitive_purposes: [code_complex, reasoning, security, production]
sensitive_excluded_backends: [data-training-provider]

# Known-broken models: skipped at chain resolution, zero wasted latency.
disabled_models: []
